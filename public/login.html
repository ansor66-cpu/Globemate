<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Globemate - Global Signup</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; padding: 20px 0; }
        .card { background: white; padding: 25px; border-radius: 10px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); width: 100%; max-width: 340px; text-align: center; }
        input, select { width: 100%; padding: 10px; margin: 8px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        label { font-size: 12px; color: #555; text-align: left; display: block; margin-top: 8px; font-weight: bold; }
        button { background: #007bff; color: white; border: none; padding: 10px; width: 100%; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 15px; }
        .preview-img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; border: 2px solid #007bff; margin: 10px auto; display: block; background: #eee; }
    </style>
</head>
<body>

<div class="card">
    <h2>Globemate Global 🌍</h2>
    <p style="font-size:12px; color:#666;">Connect worldwide with language partners</p>
    
    <label>Upload Photo</label>
    <img id="preview" src="https://cdn-icons-png.flaticon.com/512/3135/3135715.png" class="preview-img">
    <input type="file" id="photo-input" accept="image/*" onchange="previewFile()">

    <label>Full Name & Age</label>
    <div style="display:flex; gap:5px;">
        <input type="text" id="reg-name" placeholder="Name" style="width:65%;">
        <input type="number" id="reg-age" placeholder="Age" style="width:35%;">
    </div>

    <label>Country 🌍</label>
    <input type="text" id="reg-country" placeholder="e.g. Brazil 🇧🇷">

    <label>I am a:</label>
    <select id="reg-gender">
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Transgender">Transgender</option>
    </select>

    <label>I want to chat with:</label>
    <select id="reg-pref">
        <option value="Everyone">Everyone / All</option>
        <option value="Male">Male</option>
        <option value="Female">Female</option>
        <option value="Transgender">Transgender</option>
    </select>

    <label>Native & Learning Languages</label>
    <div style="display:flex; gap:5px;">
        <input type="text" id="reg-native" placeholder="Speaks" style="width:50%;">
        <input type="text" id="reg-learn" placeholder="Learning" style="width:50%;">
    </div>

    <button onclick="signup()">Join Globemate World</button>
</div>

<script>
    let base64Image = "https://cdn-icons-png.flaticon.com/512/3135/3135715.png";

    function previewFile() {
        const file = document.getElementById('photo-input').files[0];
        const reader = new FileReader();
        reader.onloadend = function() {
            base64Image = reader.result;
            document.getElementById('preview').src = base64Image;
        }
        if (file) reader.readAsDataURL(file);
    }

    function signup() {
        let name = document.getElementById("reg-name").value.trim();
        let age = document.getElementById("reg-age").value.trim();
        let country = document.getElementById("reg-country").value.trim();
        let gender = document.getElementById("reg-gender").value;
        let preference = document.getElementById("reg-pref").value;
        let nativeLang = document.getElementById("reg-native").value.trim();
        let learnLang = document.getElementById("reg-learn").value.trim();

        if (name && age && country && nativeLang && learnLang) {
            let users = JSON.parse(localStorage.getItem("globemate_users") || "[]");
            users.push({ name, age, country, gender, preference, nativeLang, learnLang, photo: base64Image });
            localStorage.setItem("globemate_users", JSON.stringify(users));
            localStorage.setItem("current_user", name);
            alert("Welcome to Globemate Global!");
            window.location.href = "profiles.html";
        } else {
            alert("Please fill all details!");
        }
    }
</script>

</body>
</html>
